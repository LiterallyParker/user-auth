<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d0809">
    <title>Email verification · Parker's Poker</title>
    <link rel="stylesheet" href="/index.css">
    <link rel="stylesheet" href="/theme.css">
    <script src="/verify-email.js" defer></script>
</head>
<body>
    <div class="app-shell">
        <div class="suit-field" aria-hidden="true">
            <span>♠</span><span>♥</span><span>♣</span><span>♦</span><span>♠</span><span>♦</span><span>♣</span><span>♥</span>
        </div>
        <header class="topbar">
            <a class="brand" href="/" aria-label="Parker's Poker home">
                <span class="brand-mark">♠</span>
                <span>Parker's <span class="brand-light">Poker</span></span>
            </a>
        </header>
        <main>
            <section class="reset-layout">
                <div class="reset-card">
                    <div class="brand-mark reset-mark" id="verify-mark">♠</div>
                    <p class="eyebrow" id="verify-eyebrow">CHECKING YOUR ID</p>
                    <h1 id="verify-title">One moment…</h1>
                    <p class="panel-copy" id="verify-copy">The doorman is looking over your invitation.</p>
                </div>
            </section>
        </main>
        <footer class="site-footer">
            <span>Parker's Poker · Play responsibly, bluff harmlessly</span>
        </footer>
    </div>
</body>
</html>
